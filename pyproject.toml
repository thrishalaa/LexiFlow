[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexiflow-backend"
version = "0.1.0"
description = "LexiFlow AI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
]

[tool.setuptools.packages.find]
where = ["src"]